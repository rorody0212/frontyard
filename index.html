<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>frontyard</title>
    <style>
        body { margin: 0; min-height: 100vh; background-color: #ffffff; font-family: sans-serif; overflow-x: hidden; }
        #desktop { width: 100vw; height: 5000px; position: relative; }
        .desktop-icon { position: absolute; cursor: pointer; user-select: none; }
        .desktop-icon img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.2)); transition: transform 0.2s; }
        .desktop-icon img:hover { transform: scale(1.08); }
        
        /* 심플한 관리자 정원 버튼 (드롭섀도우 없음) */
        .admin-mode .desktop-icon { border: 2px dashed #ff4757; cursor: move; }
        #admin-login { 
            position: fixed; top: 10px; left: 10px; z-index: 3000; cursor: pointer; 
            width: 30px; height: 30px; background-color: #dc4b4b; border-radius: 50%;
        }
        
        /* 모달: 독립 스크롤 및 중앙 정렬 */
        #modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            z-index: 1000; overflow-y: auto; box-sizing: border-box; 
        }

        #modal-content-container {
            min-height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 100px 20px;
        }

        .content-wrapper {
            width: 70vw; max-width: 800px; display: flex; flex-direction: column; align-items: center; z-index: 3;
        }

        .modal-header-image {
            width: 100%; height: auto; max-height: 60vh;
            object-fit: contain; display: block; margin-bottom: 20px;
        }

        .text-box { 
            font-size: 19px; line-height: 1.8; text-align: left; white-space: pre-wrap; width: 100%; padding-bottom: 100px;
        }

        .modal-image { max-width: 90%; max-height: 80vh; display: block; margin: auto; z-index: 3; }

        /* 무작위 위치 나가기 정원 버튼 (그림자 제거, 지름 2배인 140px) */
        .close-circle-btn {
            position: absolute; border-radius: 50%; cursor: pointer;
            width: 140px; height: 140px; z-index: 1; transition: transform 0.2s;
        }
        .close-circle-btn:hover { transform: scale(1.05); }

        .comment-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 1002; background: rgba(255,255,255,0.9); padding: 8px 15px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .comment-bar input { padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        
        #bubble-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 2;
        }
        .comment-bubble { 
            position: absolute; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px); 
            padding: 8px 14px; border-radius: 20px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            animation: float 5s infinite ease-in-out; 
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body>
    <div id="admin-login" onclick="toggleAdmin()" title="관리자"></div>
    
    <div id="desktop"></div>
    
    <div id="modal-overlay">
        <div id="close-btn-container"></div>
        <div id="bubble-container"></div>
        <div id="modal-content-container">
            <div id="modal-body"></div>
        </div>
        <div class="comment-bar" onclick="event.stopPropagation()">
            <input type="text" id="comment-author" placeholder="이름" style="width:60px">
            <input type="text" id="comment-text" placeholder="댓글..." style="width:150px">
            <button onclick="addComment()">등록</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwwOavc-bPup6lQSRirYW5DyvsceJpA47RAj4uAW203JleATUlxUR6Uob7hC_a3LOEGYQ/exec";
        let currentItem = null;
        let isAdmin = false;
        
        const colorPalette = ['#bada55', '#e4ebe8', '#b03030', '#fcf635', '#3882f9', '#020202', '#ffffff', '#273586'];

        function toggleAdmin() {
            const pass = prompt("관리자 비밀번호를 입력하세요:");
            if (pass === "1234") {
                isAdmin = !isAdmin;
                document.body.classList.toggle('admin-mode', isAdmin);
                alert(isAdmin ? "관리자 모드 활성화" : "관리자 모드 종료");
            } else if (pass !== null) {
                alert("비밀번호가 틀렸습니다.");
            }
        }

        async function loadDesktopItems() {
            let res = await fetch(WEB_APP_URL);
            let items = await res.json();
            const desktop = document.getElementById('desktop');
            desktop.innerHTML = '';
            items.forEach(item => {
                let div = document.createElement('div');
                div.className = 'desktop-icon';
                div.dataset.id = item.id;
                const size = item.size || 80;
                div.style.width = size + 'px'; 
                div.style.height = size + 'px';
                div.style.left = item.x + 'px'; 
                div.style.top = item.y + 'px';
                div.innerHTML = `<img src="${item.iconUrl}">`;
                
                div.onclick = (e) => {
                    if (!isAdmin) openModal(item);
                };
                desktop.appendChild(div);
            });
        }

        let activeIcon = null;
        let startX = 0, startY = 0;

        document.addEventListener('mousedown', (e) => {
            if (!isAdmin) return;
            const icon = e.target.closest('.desktop-icon');
            if (icon) {
                activeIcon = icon;
                startX = e.clientX - activeIcon.offsetLeft;
                startY = e.clientY - activeIcon.offsetTop;
                e.preventDefault();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!activeIcon || !isAdmin) return;
            activeIcon.style.left = (e.clientX - startX) + 'px';
            activeIcon.style.top = (e.clientY - startY) + 'px';
        });

        document.addEventListener('mouseup', async () => {
            if (!activeIcon || !isAdmin) return;
            const id = activeIcon.dataset.id;
            const x = parseInt(activeIcon.style.left);
            const y = parseInt(activeIcon.style.top);

            try {
                await fetch(`${WEB_APP_URL}?id=${id}&x=${x}&y=${y}`);
            } catch (err) {
                console.error("좌표 저장 실패", err);
            }
            activeIcon = null;
        });

        async function openModal(item) {
            let res = await fetch(WEB_APP_URL);
            let items = await res.json();
            currentItem = items.find(i => i.id == item.id);

            const body = document.getElementById('modal-body');
            const overlay = document.getElementById('modal-overlay');
            const bubbleCont = document.getElementById('bubble-container');
            const closeBtnCont = document.getElementById('close-btn-container');
            
            bubbleCont.innerHTML = ''; 
            closeBtnCont.innerHTML = '';

            const bgColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            overlay.style.backgroundColor = bgColor;

            const remainingColors = colorPalette.filter(c => c !== bgColor);
            const closeBtnColor = remainingColors[Math.floor(Math.random() * remainingColors.length)];

            const closeBtn = document.createElement('div');
            closeBtn.className = 'close-circle-btn';
            closeBtn.style.backgroundColor = closeBtnColor;
            closeBtn.style.left = (Math.random() * 70) + '%';
            closeBtn.style.top = (Math.random() * 70) + '%';
            closeBtn.onclick = closeModal;
            closeBtnCont.appendChild(closeBtn);

            const isDark = (bgColor === '#020202' || bgColor === '#273586' || bgColor === '#b03030' || bgColor === '#3882f9');

            if (currentItem.content.startsWith('http')) {
                body.innerHTML = `<img src="${currentItem.content}" class="modal-image">`;
            } else {
                body.innerHTML = `
                    <div class="content-wrapper">
                        ${currentItem.backgroundUrl ? `<img src="${currentItem.backgroundUrl}" class="modal-header-image">` : ''}
                        <div class="text-box" style="color: ${isDark ? '#ffffff' : '#000000'};">
                            ${currentItem.content}
                        </div>
                    </div>`;
            }
            
            let comments = currentItem.comments ? JSON.parse(currentItem.comments) : [];
            comments.forEach(c => createBubble(c.text, c.author));
            
            overlay.style.display = 'block';
        }

        function createBubble(text, author) {
            const div = document.createElement('div');
            div.className = 'comment-bubble';
            div.textContent = author ? `${text} - ${author}` : text;
            div.style.left = (Math.random() * 70 + 15) + '%';
            div.style.top = (Math.random() * 70 + 15) + '%';
            document.getElementById('bubble-container').appendChild(div);
        }

        async function addComment() {
            const author = document.getElementById('comment-author').value || '익명';
            const text = document.getElementById('comment-text').value;
            if(!text) return;
            
            let comments = currentItem.comments ? JSON.parse(currentItem.comments) : [];
            comments.push({author, text});
            
            const sendUrl = `${WEB_APP_URL}?id=${currentItem.id}&comments=${encodeURIComponent(JSON.stringify(comments))}`;
            new Image().src = sendUrl;
            
            createBubble(text, author);
            document.getElementById('comment-text').value = '';
            currentItem.comments = JSON.stringify(comments);
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('bubble-container').innerHTML = '';
            document.getElementById('close-btn-container').innerHTML = '';
        }

        loadDesktopItems();
    </script>
</body>
</html>
